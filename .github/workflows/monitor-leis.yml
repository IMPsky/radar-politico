name: Monitorar leis

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'scripts/leis.py' ]

permissions:
  contents: write

concurrency:
  group: monitor-leis
  cancel-in-progress: false

jobs:
  leis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir as leis no Planalto
        run: python3 scripts/leis.py

      - name: Salvar no repositorio
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leis
          git commit -m "Monitor de leis atualizado" || echo "sem mudancas"
          git pull --rebase
          git push
