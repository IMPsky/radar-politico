name: Atualizar eleições passadas

on:
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos separados por espaço (vazio = 2014 a 2024)'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths: [ 'scripts/historico.py' ]

permissions:
  contents: write

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Processar dados abertos do TSE
        run: python3 scripts/historico.py ${{ github.event.inputs.anos }}

      - name: Salvar no repositorio
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico
          git commit -m "Dados de eleicoes passadas atualizados" || echo "sem mudancas"
          git pull --rebase
          git push
