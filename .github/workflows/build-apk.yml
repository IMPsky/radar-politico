name: Gerar APK

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ 'data/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar icones
        run: |
          pip install pillow
          python3 scripts/icons.py

      - name: Corrigir certificados de sites do governo
        run: python3 scripts/certs.py || echo "aviso - verificacao de certificados falhou"

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RadarPolitico.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: RadarPolitico-apk
          path: RadarPolitico.apk
